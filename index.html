el.innerHTML=`<div class="o" style="margin-top:12px"><b>🧠 安全小測驗（${Q[i].filter((_,k)=>prog[i+'-'+k]).length}/${Q[i].length}）</b>${isDone(i)?' ✅ 本島已通過':''}</div>`+Q[i].map((q,k)=>{const ok=prog[i+'-'+k],r=(i*2+k)%3;return`<div class="qb"><div class="qt">Q${k+1}. ${q[0]}</div>`+[0,1,2].map(n=>{const o=(n+r)%3;return`<button class="qo${ok&&o===q[2]?' ok':''}" data-i="${i}" data-k="${k}" data-o="${o}"${ok?' disabled':''}>${q[1][o]}</button>`}).join('')+`<div class="fb" id="fb${i}-${k}">${ok?'✅ '+q[3]:''}</div></div>`}).join('')}
$('#pc').addEventListener('click',e=>{const b=e.target.closest('.qo');if(!b||b.disabled)return;const i=+b.dataset.i,k=+b.dataset.k,q=Q[i][k];
if(+b.dataset.o===q[2]){const was=isDone(i);prog[i+'-'+k]=1;save();quiz(i);chipsUp();progUp();if(!was&&isDone(i))toast('🎉 '+Z[i].n+' 測驗通過！');if(nDone()===8)setTimeout(showCert,1200)}
else{b.classList.add('bad');b.disabled=true;$('#fb'+i+'-'+k).textContent='❌ 不太對，再想想看～'}});
function confetti(){const f=['🎉','✨','⭐','🎊','⛑️'];for(let i=0;i<40;i++){const s=document.createElement('span');s.className='cf';s.textContent=f[i%5];s.style.cssText=`left:${Math.random()*100}%;animation-duration:${2.5+Math.random()*2.5}s;animation-delay:${Math.random()*1.2}s;font-size:${16+Math.random()*18}px`;app.appendChild(s);setTimeout(()=>s.remove(),6500)}}
function showCert(){$('#cert').style.display='flex';$('#cd').textContent=new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric'});confetti()}
$('#prog').onclick=()=>{if(nDone()===8)showCert()};
$('#c1').onclick=()=>{$('#cert').style.display='none'};
$('#c2').onclick=()=>{prog={};save();$('#cert').style.display='none';closeP();chipsUp();progUp()};
try{$('#nm').value=localStorage.getItem('safeName')||''}catch(e){}
$('#nm').oninput=e=>{try{localStorage.setItem('safeName',e.target.value)}catch(x){}};
/* panel & pick */
function closeP(){$('#p').style.display='none';sel.visible=false;off(false)}
$('#x').onclick=closeP;
function openZ(i,j){const z=Z[i];$('#pc').innerHTML=`<h2>${z.e} ${z.n}</h2><div class="o">${z.o}</div><div class="o">作業流程：${z.f}</div><div class="o"><b>工安風險（${z.r.length} 項）</b></div>`+z.r.map((nm,q)=>`<div class="r${q===j?' on':''}"><i>${R[nm][0]}</i><div><b>${nm}</b><span>${R[nm][1].replace(/、/g,'・')}</span></div></div>`).join('');
$('#p').style.display='block';quiz(i);off(true);let tg;if(j>=0){const it=z.it[j];tg=V(it.x,GY+12,it.z);sel.position.set(it.x,GY+.8,it.z);sel.visible=true}else{tg=V(z.x,GY,z.z);sel.visible=false}flyTo(tg,j>=0?150:340)}
chipsUp();progUp();
$('#chips').onclick=e=>{const b=e.target.closest('button');if(b)openZ(+b.dataset.i,-1)};
const rc=new THREE.Raycaster();let dn=null,pc=0;
cv.addEventListener('pointerdown',e=>{pc++;dn=pc>1?null:[e.clientX,e.clientY]});
cv.addEventListener('pointerup',e=>{pc=Math.max(0,pc-1);if(!dn)return;const m=Math.hypot(e.clientX-dn[0],e.clientY-dn[1]);dn=null;if(m>6)return;
const r=cv.getBoundingClientRect();rc.setFromCamera({x:(e.clientX-r.left)/r.width*2-1,y:-((e.clientY-r.top)/r.height*2-1)},cam);const h=rc.intersectObjects(roots,true)[0];if(!h)return;let o=h.object;while(o&&o.userData.z===undefined)o=o.parent;if(o)openZ(o.userData.z,o.userData.j===undefined?-1:o.userData.j)});
cv.addEventListener('pointercancel',()=>{pc=0;dn=null});
/* loop */
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.1),t=now/1000;last=now;
if(tw){const u=Math.min(1,(now-tw.t0)/750),e=1-Math.pow(1-u,3);cam.position.lerpVectors(tw.p0,tw.p1,e);oc.target.lerpVectors(tw.g0,tw.g1,e);if(u>=1)tw=null}
oc.update();AN.forEach(f=>f(t,dt));
WK.forEach(w=>{const mv=step(w,dt),u=w.g.userData;w.g.position.set(w.x,GY+(mv?Math.abs(Math.sin(w.ph))*.8:0),w.z);
if(mv){u.legs[0].rotation.x=Math.sin(w.ph)*.7;u.legs[1].rotation.x=-Math.sin(w.ph)*.7;u.arms[0].rotation.x=-Math.sin(w.ph)*.6;u.arms[1].rotation.x=Math.sin(w.ph)*.6}
else{u.legs[0].rotation.x=u.legs[1].rotation.x=0;u.arms[0].rotation.x=-1+Math.sin(t*8)*.3;u.arms[1].rotation.x=-.8}
if(w.shown!==w.say){w.shown=w.say;if(w.say)w.bb.set(w.say)}
const d=cam.position.distanceTo(w.g.position);w.nl.visible=d<320;w.bb.visible=!!w.say&&d<650});
LB.forEach(l=>{l.s.visible=cam.position.distanceTo(l.p)<l.near});
ren.render(sc,cam)}
requestAnimationFrame(loop);
</script></body></html>
